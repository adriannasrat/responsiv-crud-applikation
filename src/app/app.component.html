<a href="#main" class="skip-link">Hoppa till innehåll</a>
<header class="site-header">
  <nav
    class="navbar container app-container justify-content-between align-items-center"
    aria-label="Huvudmeny"
  >
    <a class="navbar-brand brand" routerLink="/" (click)="menuOpen.set(false)"
      ><span class="brand-icon"
        ><i class="fa-solid fa-book-open" aria-hidden="true"></i></span
      >bokrum<span class="brand-dot">.</span></a
    >
    <div class="d-flex align-items-center gap-2 order-md-last">
      <button
        class="btn icon-button theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="
          dark() ? 'Växla till ljust tema' : 'Växla till mörkt tema'
        "
        [attr.aria-pressed]="dark()"
      >
        <i
          class="fa-solid"
          [class.fa-sun]="dark()"
          [class.fa-moon]="!dark()"
          aria-hidden="true"
        ></i>
      </button>
      @if (auth.user()) {
        <button
          class="navbar-toggler"
          type="button"
          (click)="menuOpen.set(!menuOpen())"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="main-navigation"
          aria-label="Öppna eller stäng meny"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      }
    </div>
    @if (auth.user(); as user) {
      <div
        class="collapse navbar-collapse"
        id="main-navigation"
        [class.show]="menuOpen()"
      >
        <div class="navbar-nav mx-md-auto gap-md-2">
          <a
            class="nav-link"
            routerLink="/bocker"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="menuOpen.set(false)"
            ><i class="fa-solid fa-book" aria-hidden="true"></i> Mina böcker</a
          >
          <a
            class="nav-link"
            routerLink="/citat"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="menuOpen.set(false)"
            ><i class="fa-solid fa-quote-left" aria-hidden="true"></i> Mina
            citat</a
          >
        </div>
        <div class="account-menu d-flex align-items-center gap-3">
          <span class="user-name"
            ><span class="avatar" aria-hidden="true">{{
              user.username.charAt(0).toUpperCase()
            }}</span
            >{{ user.username }}</span
          ><button
            class="btn logout-button"
            type="button"
            (click)="logout()"
            [disabled]="loggingOut()"
            aria-label="Logga ut"
          >
            <i
              class="fa-solid fa-arrow-right-from-bracket"
              aria-hidden="true"
            ></i
            ><span class="d-md-none"> Logga ut</span>
          </button>
        </div>
      </div>
    }
  </nav>
</header>
<main id="main" class="container app-container main-content" tabindex="-1">
  <router-outlet />
</main>
<footer class="container app-container site-footer">
  <span>En plats för böcker och tankar.</span
  ><span>Bokrum <span aria-hidden="true">·</span> Ditt lilla bibliotek</span>
</footer>
@if (notices.message()) {
  <div class="notice shadow-sm" role="status">
    <i class="fa-solid fa-circle-info" aria-hidden="true"></i
    ><span>{{ notices.message() }}</span
    ><button
      type="button"
      class="btn icon-button"
      aria-label="Stäng meddelande"
      (click)="notices.message.set('')"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>
}
